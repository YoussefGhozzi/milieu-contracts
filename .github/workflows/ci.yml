name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Le paquet compilé se charge dans Node
        run: node -e "const c=require('./dist'); if(!c.NetworkDbSchema) throw new Error('export manquant'); console.log(Object.keys(c).length + ' exports')"
